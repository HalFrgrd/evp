[package]
name = "evp"
version = "0.1.0"
edition = "2024"

[lib]
name = "evp"
path = "src/lib.rs"

[[bin]]
name = "evp"
path = "src/bin/evp.rs"

[dependencies]
# Terminal emulator (sibling workspace; not modified). `link-static`
# vendors `libghostty-vt.a` into the final binary so neither the binary
# nor library consumers (tests, downstream crates) need
# `libghostty-vt.so` on `LD_LIBRARY_PATH` at runtime.
libghostty-vt = { path = "../libghostty-rs/crates/libghostty-vt", features = ["link-static"] }

# CLI / errors / logging.
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrency.
crossbeam-channel = "0.5"

# Pseudo-terminal & polling.
nix = { version = "0.31", features = ["term", "fs", "signal", "process", "user", "ioctl", "poll"] }

# Pattern matching for `Wait /regex/`.
regex = "1"

# Image / GIF rendering.
image = { version = "0.25", default-features = false, features = ["png"] }
gif = "0.13"
color_quant = "1"
ab_glyph = "0.2"
fontdb = "0.23"
