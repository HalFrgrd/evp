[package]
name = "evp"
version = "0.8.1"
edition = "2024"
license = "MIT"
build = "build.rs"

[lib]
name = "evp"
path = "src/lib.rs"

[[bin]]
name = "evp"
path = "src/bin/evp.rs"

[dependencies]
# Terminal emulator. We pin to a known-good libghostty-rs revision and
# statically link libghostty-vt.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "5ac47e9eb166add2c00c432bc65c279133629712", features = ["link-static"] }
# Force-enable libghostty-vt-sys pkg-config support so builds can use the
# prebuilt artifact in assets/libghostty instead of fetching Ghostty.
libghostty-vt-sys = { git = "https://github.com/uzaaft/libghostty-rs", rev = "5ac47e9eb166add2c00c432bc65c279133629712", features = ["link-static", "pkg-config"] }

# CLI / errors / logging.
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
humantime = "2"

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrency.
crossbeam-channel = "0.5"

# Pseudo-terminal & polling.
nix = { version = "0.31", features = ["term", "fs", "signal", "process", "user", "ioctl", "poll"] }

# Pattern matching for `Wait /regex/`.
regex = "1"
shell-words = "1"
crossterm = "0.29.0"

# Image / GIF rendering with streaming support.
gifski = "1.34"
rgb = "0.8"
imgref = "1.10"
ab_glyph = "0.2"
fontdb = "0.23"
woff2-patched = "0.4"
lodepng = "3.12.2"
base64 = "0.22.1"
ttf-parser = "0.25.1"
rustybuzz = "0.20.1"
flate2 = "1.1.9"
font-subset = { version = "0.1.0", features = ["woff2"] }



[build-dependencies]
vergen-gitcl = { version = "10.0.0-beta.8", features = ["build", "cargo", "rustc"] }

# Release profile for distributed binaries. `lto = "fat"` lets the
# linker inline across crate boundaries (notable for gifski, ab_glyph
# and the libghostty-vt static lib). `codegen-units = 1` gives LLVM
# the widest view for inlining/dead-code elimination at the cost of
# build parallelism. `strip = "symbols"` drops debug + symbol tables
# from the final ELF \u2014 with the static-musl build this typically
# halves the on-disk size.
# [profile.release]
# lto = "fat"
# codegen-units = 1
# strip = "symbols"
