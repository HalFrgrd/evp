[env]
PKG_CONFIG_PATH = { value = "assets/libghostty/share/pkgconfig", relative = true }
# Required when the default target (musl) differs from the host triple so that
# pkg-config doesn't refuse to run for "cross" builds.
PKG_CONFIG_ALLOW_CROSS = "1"

# Always build against musl so binaries are fully static with no glibc version
# dependency. libghostty-vt.a is also built with -Dtarget=x86_64-linux-musl for
# the same reason.
[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes", "-C", "linker=rust-lld"]
linker = "musl-gcc"
