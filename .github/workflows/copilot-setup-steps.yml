name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Install Zig 0.15.2
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64)  zig_arch="x86_64" ;;
            aarch64) zig_arch="aarch64" ;;
            *) echo "unsupported arch $arch" >&2; exit 1 ;;
          esac
          tarball="zig-${zig_arch}-linux-0.15.2.tar.xz"
          curl -fsSLo "/tmp/${tarball}" \
            "https://ziglang.org/download/0.15.2/${tarball}"
          sudo mkdir -p /opt
          sudo tar -xJf "/tmp/${tarball}" -C /opt
          sudo mv "/opt/zig-${zig_arch}-linux-0.15.2" /opt/zig
          rm "/tmp/${tarball}"
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
