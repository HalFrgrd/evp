name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
    env:
      BUILD_ENV_IMAGE: ghcr.io/halfrgrd/evp-build-env:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Refresh and cache build-env image locally
        run: |
          set -euo pipefail
          docker pull "${BUILD_ENV_IMAGE}"

      - name: Prebuild libghostty pkg-config artifacts
        run: |
          set -euo pipefail
          rm -rf assets/libghostty
          docker buildx bake extract-libghostty

      - name: Verify prebuilt libghostty assets
        run: |
          set -euo pipefail
          test -f assets/libghostty/lib/libghostty-vt.a
          test -f assets/libghostty/include/ghostty/vt.h
          test -f assets/libghostty/share/pkgconfig/libghostty-vt-static.pc
