name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prebuild libghostty pkg-config artifacts
        # mode=min caches only the final export stage (~14 MB of .a + headers),
        # not the intermediate build layers (apt, zig, git clone, zig build).
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: extract-libghostty
          set: |
            extract-libghostty.output=type=local,dest=${{ runner.temp }}/docker/libghostty
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=min

      - name: Copy prebuilt libghostty to assets
        run: |
          rm -rf assets/libghostty
          mkdir -p assets
          cp -r ${{ runner.temp }}/docker/libghostty assets/libghostty

      - name: Verify prebuilt libghostty assets
        run: |
          set -euo pipefail
          test -f assets/libghostty/lib/libghostty-vt.a
          test -f assets/libghostty/include/ghostty/vt.h
          test -f assets/libghostty/share/pkgconfig/libghostty-vt-static.pc
