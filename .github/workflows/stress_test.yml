name: stress_test

# Runs the stress-test benchmark for the evp PTY → encoder → renderer
# pipeline and compares the resulting GIF (and timing) against an
# equivalent VHS run.
#
# The build environment is the bake `stress_test` target wired from split
# Dockerfiles, with the same Rust + Zig toolchain as ci.yml / release.yml / docker.yml. The
# runner never installs Rust, Zig, or any other build tooling; every
# build, VHS run, and analysis step runs inside the image.
#
# Trigger: manual (workflow_dispatch) or any push that touches the
# benchmark surface (the example, the tape, the stress_test program, the
# library bits it exercises, the Dockerfiles/bake wiring, or this workflow itself).

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "examples/stress_test_benchmark.rs"
      - "examples/stress_test.tape"
      - "scripts/stress_test_program.py"
      - "scripts/stress_test_compare.sh"
      - "scripts/gif_frame_analyzer.py"
      - "src/runner.rs"
      - "src/encoder.rs"
      - "src/renderer.rs"
      - "src/render.rs"
      - "src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/*.Dockerfile"
      - "docker-bake.hcl"
      - ".github/workflows/stress_test.yml"
  pull_request:
    branches: [master]
    paths:
      - "examples/stress_test_benchmark.rs"
      - "examples/stress_test.tape"
      - "scripts/stress_test_program.py"
      - "scripts/stress_test_compare.sh"
      - "scripts/gif_frame_analyzer.py"
      - "docker/*.Dockerfile"
      - "docker-bake.hcl"
      - ".github/workflows/stress_test.yml"

permissions:
  contents: read

concurrency:
  group: stress_test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress_test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + run stress_test via Dockerfile
        # The stress_test Dockerfile itself now executes:
        # - evp benchmark
        # - VHS render
        # - frame analysis + markdown report
        # and exports the generated artifacts to `stress_test-out`.
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: stress_test
          load: false
          push: false
          set: |
            stress_test.output=type=local,dest=./stress_test-out
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Print comparison report
        run: |
          set -eux
          echo
          echo "=== comparison.md ==="
          cat stress_test-out/comparison.md
          cat stress_test-out/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stress_test artifact
        uses: actions/upload-artifact@v4
        with:
          name: stress_test-comparison
          path: |
            stress_test-out/evp.gif
            stress_test-out/vhs.gif
            stress_test-out/evp.report.txt
            stress_test-out/vhs.report.txt
            stress_test-out/evp.gif.analysis.json
            stress_test-out/vhs.gif.analysis.json
            stress_test-out/comparison.md
          if-no-files-found: warn

      - name: Enforce pass/fail
        # The Docker build fails as soon as evp exceeds the drop threshold.
        # Keep a persisted-report assertion as a belt-and-braces check.
        run: |
          set -eu
          test -s stress_test-out/evp.gif
          test -s stress_test-out/vhs.gif
          result=$(awk -F'=' '/^result/ { gsub(/[[:space:]]/,"",$2); print $2 }' stress_test-out/evp.report.txt)
          echo "evp result: $result"
          test "$result" = "PASS"
