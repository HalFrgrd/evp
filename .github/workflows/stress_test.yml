name: stress_test

# Runs the stress-test benchmark for the evp PTY → encoder → renderer
# pipeline and compares the resulting GIF (and timing) against an
# equivalent VHS run. This is executed entirely inside Docker via Bake.
#
# Trigger: manual (workflow_dispatch) or from another workflow via
# workflow_call.

on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: stress_test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress_test:
    name: Run Stress Test in Docker
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Bake Stress Test
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: stress-test
          set: |
            stress-test.output=type=local,dest=stress_test-out
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=min
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_BRANCH: ${{ github.ref_name }}
          VERGEN_GIT_COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          VERGEN_GIT_DIRTY: "false"

      - name: Print comparison report
        run: |
          set -eux
          echo
          echo "=== comparison.md ==="
          cat stress_test-out/comparison.md
          cat stress_test-out/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stress_test artifact
        uses: actions/upload-artifact@v7
        with:
          name: stress_test-comparison
          path: |
            stress_test-out/evp.gif
            stress_test-out/vhs.gif
            stress_test-out/evp.report.txt
            stress_test-out/vhs.report.txt
            stress_test-out/evp.gif.analysis.json
            stress_test-out/vhs.gif.analysis.json
            stress_test-out/comparison.md
          if-no-files-found: warn
