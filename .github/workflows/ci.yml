name: ci

# Sanity-check builds and tests on every push / PR.
#
# Everything runs inside the project Dockerfile so the build environment
# stays identical to the one used by `release.yml` and `docker.yml`:
# Rust + Zig 0.15.x + cargo-zigbuild, targeting glibc 2.17 for max
# portability.
#
# The Dockerfile's `test` stage runs `cargo build --workspace` and
# `cargo test --workspace`. If that stage builds successfully, the
# whole workspace compiles and all tests pass. No further steps needed.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + test (Dockerfile `test` stage)
        # `--target test` runs the workspace test suite as part of the
        # docker build — cache mounts inside the Dockerfile speed up
        # subsequent runs. We don't push anything; the image stays on
        # the runner and is discarded.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: test
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

