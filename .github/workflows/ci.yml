name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + test (bake `test` target)
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: test
          load: false
          push: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
