name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prebuild libghostty pkg-config artifacts
        run: |
          set -euo pipefail
          rm -rf assets/libghostty
          docker buildx bake extract-libghostty

      - name: Build and test
        run: |
          cargo build --workspace
          cargo test --workspace --lib --bins -- --test-threads=1
          cargo test --workspace --tests -- --test-threads=1
