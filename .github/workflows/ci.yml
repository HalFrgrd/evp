name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test in Docker
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Build and Test
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: |
            test
            evp
          set: |
            evp.output=type=local,dest=docker/build
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_BRANCH: ${{ github.ref_name }}
          VERGEN_GIT_COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          VERGEN_GIT_DIRTY: "false"

      - name: Test subcommands on runner
        run: |
          chmod +x docker/build/evp
          docker/build/evp print-ref-script > test-ci.tape
          docker/build/evp test-ci.tape --output test-ci.gif

  render-examples-matrix:
    name: Render Example (${{ matrix.example }})
    needs: build-and-test
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        example:
          - char_spacing
          - colors
          - cols_rows
          - embedded-font-demo
          - evp_demo
          - evp_record_demo
          - hello
          - keys
          - margin
          - mouse
          - mouse_small
          - my_program_demo
          - padding
          - progress
          - shell-tour
          - test
          - window_title
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build example in Docker
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: example-${{ matrix.example }}
          set: |
            *.output=type=local,dest=${{ runner.temp }}/docker/examples
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=min
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_BRANCH: ${{ github.ref_name }}
          VERGEN_GIT_COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          VERGEN_GIT_DIRTY: "false"

      - name: Upload example artifacts
        uses: actions/upload-artifact@v7
        with:
          name: example-build-${{ matrix.example }}
          path: ${{ runner.temp }}/docker/examples/*
          if-no-files-found: error

  publish-examples-release:
    name: Consolidate and Publish Examples
    needs: render-examples-matrix
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all example artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: example-build-*
          path: ${{ runner.temp }}/docker/examples
          merge-multiple: true

      - name: Generate performance stats summary
        run: ./scripts/generate_stats_summary.py
        env:
          STATS_DIR: ${{ runner.temp }}/docker/examples

      - name: Upload examples performance stats
        uses: actions/upload-artifact@v7
        with:
          name: examples-performance-stats
          path: ${{ runner.temp }}/docker/examples/*.stats
          if-no-files-found: warn

      - name: Upload to the `assets` release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: assets
          name: Example assets
          body: |
            Pre-rendered GIFs and SVGs of every script in `examples/`.

            These assets are rebuilt automatically by the
            `ci` workflow on every push to `master`. The README links
            to them via the stable release-download URL.

            Last build: ${{ github.sha }}
          files: |
            ${{ runner.temp }}/docker/examples/*.gif
            ${{ runner.temp }}/docker/examples/*.svg
          fail_on_unmatched_files: true
          make_latest: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
