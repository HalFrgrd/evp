name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prebuild libghostty pkg-config artifacts
        uses: docker/bake-action@v4
        with:
          files: docker-bake.hcl
          targets: extract-libghostty
          set: |
            extract-libghostty.output=type=local,dest=${{ runner.temp }}/docker/libghostty
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Copy prebuilt libghostty to assets
        run: |
          rm -rf assets/libghostty
          mkdir -p assets
          cp -r ${{ runner.temp }}/docker/libghostty assets/libghostty

      - name: Build and test (release)
        run: |
          cargo build --workspace --release
          cargo test --workspace --release --lib --bins -- --test-threads=1
          cargo test --workspace --release --tests -- --test-threads=1

      - name: Upload evp binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: evp-release-bin
          path: target/release/evp

  render-examples:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: ["demo", "meta", "screenshot", "welcome"]
        ext: ["gif", "svg"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download evp binary artifact
        uses: actions/download-artifact@v4
        with:
          name: evp-release-bin
          path: ./evp-bin
      - name: Render ${{ matrix.name }}.${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p out
          chmod +x ./evp-bin/evp
          ./evp-bin/evp "examples/${{ matrix.name }}.tape" --output "out/${{ matrix.name }}.${{ matrix.ext }}"
          ls -lh out/

      - name: Upload to the `assets` release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: assets
          name: Example assets
          body: |
            Pre-rendered GIFs of every script in `examples/`.

            These assets are rebuilt automatically by the
            `ci` workflow on every push to `master`. The README links
            to them via the stable release-download URL.

            Last build: ${{ github.sha }}
          files: |
            out/*.gif
            out/*.svg
          fail_on_unmatched_files: true
          make_latest: "false"
          token: ${{ secrets.GITHUB_TOKEN }}

  