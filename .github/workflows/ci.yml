name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prebuild libghostty pkg-config artifacts
        run: |
          set -euo pipefail
          rm -rf assets/libghostty
          docker buildx bake \
            --set extract-libghostty.cache-from=type=gha,scope=libghostty-pkgconfig-${{ runner.os }}-${{ runner.arch }} \
            --set extract-libghostty.cache-to=type=gha,scope=libghostty-pkgconfig-${{ runner.os }}-${{ runner.arch }},mode=max \
            extract-libghostty

      - name: Build and test
        run: |
          cargo build --workspace
          cargo test --workspace --lib --bins -- --test-threads=1
          cargo test --workspace --tests -- --test-threads=1

      - name: Build release evp for examples
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cargo build --release --bin evp

      - name: Render every example to a GIF and SVG
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          mkdir -p out
          for tape in examples/*.tape; do
              name=$(basename "$tape" .tape)
              for ext in gif svg; do
                  echo "::group::rendering $name.$ext"
                  ./target/release/evp "$tape" --output "out/$name.$ext"
                  echo "::endgroup::"
              done
          done
          ls -lh out/

      - name: Upload to the `assets` release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: assets
          name: Example assets
          body: |
            Pre-rendered GIFs of every script in `examples/`.

            These assets are rebuilt automatically by the
            `ci` workflow on every push to `master`. The README links
            to them via the stable release-download URL.

            Last build: ${{ github.sha }}
          files: |
            out/*.gif
            out/*.svg
          fail_on_unmatched_files: true
          make_latest: "false"
          token: ${{ secrets.GITHUB_TOKEN }}

  stress-test:
    uses: ./.github/workflows/stress_test.yml
    permissions:
      contents: read
