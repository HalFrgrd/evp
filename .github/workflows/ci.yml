name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test in Docker
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Build and Test
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: |
            test
            evp
          set: |
            evp.output=type=local,dest=${{ runner.temp }}/docker/build
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=min
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_BRANCH: ${{ github.ref_name }}
          VERGEN_GIT_COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          VERGEN_GIT_DIRTY: "false"

      - name: Upload evp binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: evp-release-bin
          path: ${{ runner.temp }}/docker/build/evp
          if-no-files-found: error

      - name: Test subcommands on runner
        run: |
          chmod +x ${{ runner.temp }}/docker/build/evp
          ${{ runner.temp }}/docker/build/evp print-ref-script > /dev/null
          ${{ runner.temp }}/docker/build/evp run-sample-script --output ${{ runner.temp }}/test-ci.gif

  render-examples:
    name: Render Examples and Release
    needs: build-and-test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build all examples in Docker
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: examples
          set: |
            *.output=type=local,dest=${{ runner.temp }}/docker/examples
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=min
        env:
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_BRANCH: ${{ github.ref_name }}
          VERGEN_GIT_COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          VERGEN_GIT_DIRTY: "false"
      - name: Generate performance stats summary
        run: ./scripts/generate_stats_summary.py
        env:
          STATS_DIR: ${{ runner.temp }}/docker/examples

      - name: Upload examples performance stats
        uses: actions/upload-artifact@v7
        with:
          name: examples-performance-stats
          path: ${{ runner.temp }}/docker/examples/*.stats
          if-no-files-found: warn

      - name: Upload to the `assets` release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: assets
          name: Example assets
          body: |
            Pre-rendered GIFs and SVGs of every script in `examples/`.

            These assets are rebuilt automatically by the
            `ci` workflow on every push to `master`. The README links
            to them via the stable release-download URL.

            Last build: ${{ github.sha }}
          files: |
            ${{ runner.temp }}/docker/examples/*.gif
            ${{ runner.temp }}/docker/examples/*.svg
          fail_on_unmatched_files: true
          make_latest: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
