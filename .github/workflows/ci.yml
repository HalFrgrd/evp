name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prebuild libghostty pkg-config artifacts
        run: |
          set -euo pipefail
          rm -rf assets/libghostty
          docker buildx bake extract-libghostty

      - name: Compute optional extra CA fingerprint
        id: extra_ca
        env:
          EXTRA_CA_CERT: ${{ secrets.EXTRA_CA_CERT }}
        run: |
          set -euo pipefail
          if [ -n "${EXTRA_CA_CERT:-}" ]; then
            echo "fingerprint=$(printf '%s' "$EXTRA_CA_CERT" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "fingerprint=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + test (bake `test` target)
        uses: docker/bake-action@v5
        env:
          EXTRA_CA_CERT: ${{ secrets.EXTRA_CA_CERT }}
        with:
          files: ./docker-bake.hcl
          targets: test
          load: false
          push: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.args.EXTRA_CA_CERT_FINGERPRINT=${{ steps.extra_ca.outputs.fingerprint }}
