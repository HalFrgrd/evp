name: ci

# Sanity-check builds and tests on every push / PR. Intentionally cheap
# (no docker, no example rendering) so it runs fast and gates merges.
#
# `libghostty-vt` and `libghostty-vt-sys` are pulled from crates.io – no
# sibling git checkout needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: 0.15.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        # libghostty-vt-sys's build.rs invokes `zig build` to compile the
        # vendored Ghostty source; Zig 0.15.x must be on PATH.
        run: |
          set -eux
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSLo "/tmp/${tarball}" "https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          sudo tar -xJf "/tmp/${tarball}" -C /opt
          sudo mv "/opt/zig-x86_64-linux-${ZIG_VERSION}" /opt/zig
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        # Tests fork /bin/sh in a PTY; serialise to keep PTY allocation
        # under control on small CI runners.
        run: cargo test --workspace -- --test-threads=1
