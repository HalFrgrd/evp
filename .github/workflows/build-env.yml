name: build-env

on:
  push:
    branches: [master]
    paths:
      - "docker/build-env.Dockerfile"
      - "docker/cache-warmer/**"
      - "docker-bake.hcl"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-env.yml"
  pull_request:
    branches: [master]
    paths:
      - "docker/build-env.Dockerfile"
      - "docker/cache-warmer/**"
      - "docker-bake.hcl"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-env.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: img
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${owner_lc}/evp-build-env" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push build-env image
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: build-env
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            build-env.tags=${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
            build-env.cache-from=type=gha
            build-env.cache-to=type=gha,mode=max
