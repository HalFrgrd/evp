name: docker

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: img
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${owner_lc}/evp" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Normalize tags for bake
        id: tags
        run: |
          set -euo pipefail
          tags_csv="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | paste -sd, -)"
          echo "csv=${tags_csv}" >> "$GITHUB_OUTPUT"

      - name: Compute git metadata for Docker build
        id: gitmeta
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          commit_date="$(git show -s --format=%cs "$sha")"
          commit_timestamp="$(git show -s --format=%cI "$sha")"
          commit_count="$(git rev-list --count "$sha")"
          author_name="$(git show -s --format=%an "$sha")"
          author_email="$(git show -s --format=%ae "$sha")"
          commit_message="$(git show -s --format=%B "$sha" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')"
          describe="$(git describe --always --dirty --tags "$sha" 2>/dev/null || git rev-parse --short "$sha")"
          dirty="false"

          {
            echo "sha=${sha}"
            echo "branch=${branch}"
            echo "commit_date=${commit_date}"
            echo "commit_timestamp=${commit_timestamp}"
            echo "commit_count=${commit_count}"
            echo "author_name=${author_name}"
            echo "author_email=${author_email}"
            echo "commit_message=${commit_message}"
            echo "describe=${describe}"
            echo "dirty=${dirty}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push runtime image
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: runtime
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            runtime.tags=${{ steps.tags.outputs.csv }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.args.VERGEN_GIT_SHA=${{ steps.gitmeta.outputs.sha }}
            *.args.VERGEN_GIT_BRANCH=${{ steps.gitmeta.outputs.branch }}
            *.args.VERGEN_GIT_COMMIT_DATE=${{ steps.gitmeta.outputs.commit_date }}
            *.args.VERGEN_GIT_COMMIT_TIMESTAMP=${{ steps.gitmeta.outputs.commit_timestamp }}
            *.args.VERGEN_GIT_COMMIT_COUNT=${{ steps.gitmeta.outputs.commit_count }}
            *.args.VERGEN_GIT_COMMIT_AUTHOR_NAME=${{ steps.gitmeta.outputs.author_name }}
            *.args.VERGEN_GIT_COMMIT_AUTHOR_EMAIL=${{ steps.gitmeta.outputs.author_email }}
            *.args.VERGEN_GIT_COMMIT_MESSAGE=${{ steps.gitmeta.outputs.commit_message }}
            *.args.VERGEN_GIT_DESCRIBE=${{ steps.gitmeta.outputs.describe }}
            *.args.VERGEN_GIT_DIRTY=${{ steps.gitmeta.outputs.dirty }}
