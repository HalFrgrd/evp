name: release

# Builds a prebuilt static `evp` binary on tag push and uploads it to
# the GitHub Release. The accompanying `action.yml` at the repo root
# downloads this artifact in user workflows.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to attach the release to (e.g. v0.2.0)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          gh release create "$tag" --draft --verify-tag --title "$tag"
    outputs:
      version: ${{ steps.tag.outputs.name }}

  build-release:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets (built via cargo/cross/docker buildx)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            build_tool: cargo
            docker_platform: linux/amd64
            zig_target: x86_64-linux-musl

          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            build_tool: cross
            docker_platform: linux/arm64
            zig_target: aarch64-linux-musl

          # macOS targets (built natively)
          - target: x86_64-apple-darwin
            os: macos-14
            build_tool: cargo
            zig_target: x86_64-macos

          - target: aarch64-apple-darwin
            os: macos-14
            build_tool: cargo
            zig_target: aarch64-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang musl-dev musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.build_tool == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Set up Docker Buildx (Linux)
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v4

      - name: Prebuild libghostty pkg-config artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rm -rf assets/libghostty
          docker buildx bake \
            --set extract-libghostty.platform=${{ matrix.docker_platform }} \
            --set extract-libghostty.cache-from=type=gha,scope=libghostty-pkgconfig-${{ matrix.target }} \
            --set extract-libghostty.cache-to=type=gha,scope=libghostty-pkgconfig-${{ matrix.target }},mode=min \
            extract-libghostty

      - name: Set up Zig (macOS)
        if: runner.os == 'macOS'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Prebuild libghostty pkg-config artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ghostty-org/ghostty.git ghostty-src
          cd ghostty-src
          git checkout 6590196661f769dd8f2b3e85d6c98262c4ec5b3b
          zig build \
              -Demit-lib-vt \
              -Doptimize=ReleaseFast \
              -Demit-xcframework=false \
              -Dapp-runtime=none \
              -Dtarget=${{ matrix.zig_target }} \
              -Dcpu=baseline \
              --prefix ../ghostty-install
          cd ..
          mkdir -p assets/libghostty/lib assets/libghostty/include/ghostty assets/libghostty/share/pkgconfig
          cp ghostty-install/lib/libghostty-vt.a assets/libghostty/lib/
          cp -r ghostty-install/include/ghostty assets/libghostty/include/
          cp ghostty-install/share/pkgconfig/libghostty-vt-static.pc assets/libghostty/share/pkgconfig/
          sed -i '' 's|^prefix=.*|prefix=${pcfiledir}/../..|' assets/libghostty/share/pkgconfig/libghostty-vt-static.pc

      - name: Build static evp binary
        run: |
          set -eux
          ${{ matrix.build_tool }} build --release --target ${{ matrix.target }} --bin evp
          mkdir -p /tmp/evp-build
          cp "target/${{ matrix.target }}/release/evp" /tmp/evp-build/evp

      - name: Sanity check extracted binary
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: |
          set -eux
          chmod +x /tmp/evp-build/evp
          file /tmp/evp-build/evp
          if [ "${{ runner.os }}" = "Linux" ]; then
            (ldd /tmp/evp-build/evp 2>&1 || true)
          else
            (otool -L /tmp/evp-build/evp 2>&1 || true)
          fi
          /tmp/evp-build/evp --version

      - name: Package tarball
        id: pkg
        run: |
          set -eux
          tag="${{ needs.create-release.outputs.version }}"
          version="${tag#v}"
          stage="evp-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp /tmp/evp-build/evp "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/" 2>/dev/null || true
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          else
            (cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          fi
          ls -lh dist
          echo "tarball=dist/${stage}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${stage}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.create-release.outputs.version }}"
          gh release upload "$tag" "${{ steps.pkg.outputs.tarball }}" "${{ steps.pkg.outputs.checksum }}"

  publish-docker:
    name: Build and Publish Demo Docker Image
    needs: [create-release, build-release]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Demo Image
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: demo
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=min
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.create-release.outputs.version }}
          IMAGE_EXTRA_TAG: latest
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_BRANCH: ${{ github.ref_name }}
          VERGEN_GIT_COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          VERGEN_GIT_DIRTY: "false"

      - name: Validate Demo Image
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: validate-demo
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=min
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.create-release.outputs.version }}
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_BRANCH: ${{ github.ref_name }}
          VERGEN_GIT_COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          VERGEN_GIT_DIRTY: "false"

      - name: Upload validation GIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: validation-gif
          path: ci/build/validation/test_run.gif
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as prerelease and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.create-release.outputs.version }}"
          gh release edit "$tag" --prerelease --draft=false --repo "${{ github.repository }}"

  test-action:
    name: Test GitHub Action
    needs: [create-release, publish-release]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for Release API replication
        run: |
          tag="${{ needs.create-release.outputs.version }}"
          api="https://api.github.com/repos/${{ github.repository }}/releases/tags/${tag}"
          echo "Checking release availability: ${api}"
          for i in {1..12}; do
            if curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$api" > /dev/null; then
              echo "Release is available!"
              exit 0
            fi
            echo "Release not available yet, retrying in 5 seconds..."
            sleep 5
          done
          echo "Warning: Release API check timed out, proceeding anyway..."

      - name: Test local action using the new release
        uses: ./
        with:
          script: examples/hello.tape
          output: /tmp/action-test.gif
          version: ${{ needs.create-release.outputs.version }}

      - name: Verify generated GIF
        run: |
          ls -lh /tmp/action-test.gif
          file /tmp/action-test.gif

      - name: Upload action test GIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: action-test-gif
          path: /tmp/action-test.gif
          if-no-files-found: error
