name: release

# Builds a prebuilt static `evp` binary on tag push and uploads it to
# the GitHub Release. The accompanying `action.yml` at the repo root
# downloads this artifact in user workflows.
#
# The build runs through the project Dockerfile so the toolchain stays
# identical to ci.yml and docker.yml: Rust + Zig 0.15.x targeting
# `x86_64-unknown-linux-musl`. The result is a fully static binary
# with mimalloc bundled in — no glibc version compat issues.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to attach the release to (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-amd64:
    name: build evp-x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build evp via Dockerfile (builder stage)
        # `--target builder` stops at the stage that produces
        # /usr/local/bin/evp. We then copy that file out via a throwaway
        # container so we can package it as a release tarball.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: builder
          push: false
          load: true
          tags: evp-builder:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract evp binary from image
        run: |
          set -eux
          mkdir -p out
          id="$(docker create evp-builder:release /bin/true)"
          docker cp "${id}:/usr/local/bin/evp" out/evp
          docker rm "${id}" >/dev/null
          chmod +x out/evp
          file out/evp
          (ldd out/evp 2>&1 || true)
          out/evp --version

      - name: Package tarball
        id: pkg
        run: |
          set -eux
          tag="${{ steps.tag.outputs.name }}"
          version="${tag#v}"
          stage="evp-${version}-${TARGET}"
          mkdir -p "dist/${stage}"
          cp out/evp "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/" 2>/dev/null || true
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          (cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          ls -lh dist
          echo "tarball=dist/${stage}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${stage}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true
          generate_release_notes: true
