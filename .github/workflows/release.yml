name: release

# Builds a prebuilt static `evp` binary on tag push and uploads it to
# the GitHub Release. The accompanying `action.yml` at the repo root
# downloads this artifact in user workflows.
#
# The build runs through docker-bake's split Dockerfiles so the toolchain stays
# identical to ci.yml and docker.yml: Rust + Zig 0.15.x targeting
# `x86_64-unknown-linux-musl`. The result is a fully static binary
# with mimalloc bundled in — no glibc version compat issues.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to attach the release to (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-amd64:
    name: build evp-x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prebuild libghostty pkg-config artifacts
        run: |
          set -euo pipefail
          rm -rf assets/libghostty
          docker buildx bake extract-libghostty

      - name: Compute optional extra CA fingerprint
        id: extra_ca
        env:
          EXTRA_CA_CERT: ${{ secrets.EXTRA_CA_CERT }}
        run: |
          set -euo pipefail
          if [ -n "${EXTRA_CA_CERT:-}" ]; then
            echo "fingerprint=$(printf '%s' "$EXTRA_CA_CERT" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "fingerprint=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: Build evp binary via docker buildx bake
        # `extract-binary` writes the static evp directly to
        # /tmp/evp-build/evp on the host filesystem — no `docker create`
        # / `docker cp` plumbing needed. The bake target is the same
        # one local users invoke for a one-shot build.
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          EXTRA_CA_CERT: ${{ secrets.EXTRA_CA_CERT }}
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: extract-binary
          load: false
          push: false
          set: |
            extract-binary.output=type=local,dest=/tmp/evp-build
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.args.EXTRA_CA_CERT_FINGERPRINT=${{ steps.extra_ca.outputs.fingerprint }}

      - name: Sanity check extracted binary
        run: |
          set -eux
          chmod +x /tmp/evp-build/evp
          file /tmp/evp-build/evp
          (ldd /tmp/evp-build/evp 2>&1 || true)
          /tmp/evp-build/evp --version

      - name: Package tarball
        id: pkg
        run: |
          set -eux
          tag="${{ steps.tag.outputs.name }}"
          version="${tag#v}"
          stage="evp-${version}-${TARGET}"
          mkdir -p "dist/${stage}"
          cp /tmp/evp-build/evp "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/" 2>/dev/null || true
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          (cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          ls -lh dist
          echo "tarball=dist/${stage}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${stage}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true
          generate_release_notes: true
