name: release

# Builds a prebuilt static `evp` binary on tag push and uploads it to
# the GitHub Release. The accompanying `action.yml` at the repo root
# downloads this artifact in user workflows.
#
# The build targets `x86_64-unknown-linux-musl` for a fully static binary
# with no glibc version compat issues.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to attach the release to (e.g. v0.2.0)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-amd64:
    name: build evp-x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang musl-dev musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: x86_64-unknown-linux-musl

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prebuild libghostty pkg-config artifacts
        run: |
          set -euo pipefail
          rm -rf assets/libghostty
          docker buildx bake \
            --set extract-libghostty.cache-from=type=gha,scope=libghostty-pkgconfig-${{ runner.os }}-${{ runner.arch }} \
            --set extract-libghostty.cache-to=type=gha,scope=libghostty-pkgconfig-${{ runner.os }}-${{ runner.arch }},mode=max \
            extract-libghostty

      - name: Build static evp binary
        run: |
          set -eux
          cargo build --release --bin evp
          mkdir -p /tmp/evp-build
          cp "target/${TARGET}/release/evp" /tmp/evp-build/evp

      - name: Sanity check extracted binary
        run: |
          set -eux
          chmod +x /tmp/evp-build/evp
          file /tmp/evp-build/evp
          (ldd /tmp/evp-build/evp 2>&1 || true)
          /tmp/evp-build/evp --version

      - name: Package tarball
        id: pkg
        run: |
          set -eux
          tag="${{ steps.tag.outputs.name }}"
          version="${tag#v}"
          stage="evp-${version}-${TARGET}"
          mkdir -p "dist/${stage}"
          cp /tmp/evp-build/evp "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/" 2>/dev/null || true
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          (cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          ls -lh dist
          echo "tarball=dist/${stage}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${stage}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true
          generate_release_notes: true
