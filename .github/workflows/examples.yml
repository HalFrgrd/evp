name: examples

# Builds every script in examples/ into a GIF and uploads them as assets
# attached to the `assets` GitHub release. The README links to the GIFs
# at their stable release-asset URLs:
#
#   https://github.com/<owner>/<repo>/releases/download/assets/<name>.gif
#
# We use a single rolling release named "assets" rather than tagging each
# build so the README links never go stale.

on:
  push:
    branches: [master]
    paths:
      - "examples/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/*.Dockerfile"
      - "docker-bake.hcl"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

permissions:
  contents: write    # needed by softprops/action-gh-release to update the release
  packages: read     # needed to pull the evp container image from ghcr.io

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        # Container references must be lowercase, but `github.repository_owner`
        # preserves the original GitHub casing (e.g. `HalFrgrd`). Normalise.
        id: img
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner_lc}/evp:latest" >> "$GITHUB_OUTPUT"

      - name: Pull the evp image
        # We always run examples against the latest published image. The
        # docker workflow is responsible for keeping it up to date.
        run: docker pull ${{ steps.img.outputs.ref }}

      - name: Render every example to a GIF and SVG
        run: |
          set -euo pipefail
          mkdir -p out
          for tape in examples/*.tape; do
              name=$(basename "$tape" .tape)
              for ext in gif svg; do
                  echo "::group::rendering $name.$ext"
                  docker run --rm \
                      -v "$PWD:/work" \
                      ${{ steps.img.outputs.ref }} \
                      "examples/$name.tape" \
                      --output "out/$name.$ext"
                  echo "::endgroup::"
              done
          done
          ls -lh out/

      - name: Upload to the `assets` release
        # Replaces only the .gif assets on the rolling `assets` release.
        # `make_latest: false` keeps the latest semver release flagged as
        # latest in the UI; `assets` is just the artifact dump.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: assets
          name: Example assets
          body: |
            Pre-rendered GIFs of every script in `examples/`.

            These assets are rebuilt automatically by the
            `examples` workflow on every push to `master`. The README links
            to them via the stable release-download URL.

            Last build: ${{ github.sha }}
          files: |
            out/*.gif
            out/*.svg
          fail_on_unmatched_files: true
          make_latest: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
